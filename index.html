<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>عالم البلوكات</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #eae4d3;
      --panel: #f7f2e4;
      --ink: #2d2a22;
      --muted: #756f5f;
      --line: #d6cdb4;
      --accent: #3e8e41;
      --accent-ink: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1c1a17;
        --panel: #282520;
        --ink: #e6dfcf;
        --muted: #a39c8c;
        --line: #423e35;
        --accent: #52b856;
        --accent-ink: #1c1a17;
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #game-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* واجهة البداية */
    #menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      color: #fff;
    }
    #menu h1 {
      font-size: 3rem;
      margin-bottom: 2rem;
      text-shadow: 2px 2px #000;
    }
    .menu-btn {
      background: var(--panel);
      color: var(--ink);
      border: 2px solid var(--line);
      padding: 12px 24px;
      font-size: 1.2rem;
      margin: 8px;
      width: 250px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      transition: 0.2s;
    }
    .menu-btn:active {
      background: var(--accent);
      color: var(--accent-ink);
    }
    #status {
      margin-top: 15px;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <div id="game-container"></div>

  <!-- واجهة اللعبة -->
  <div id="menu">
    <h1>عالم البلوكات</h1>
    <button class="menu-btn" id="btnPlay">لعب فردي</button>
    <button class="menu-btn" id="btnNew">عالم جديد</button>
    <button class="menu-btn" id="btnHow">كيفاش نلعب</button>
    <div id="status">جاري تشغيل اللعبة محلياً...</div>
  </div>

  <!-- استدعاء المكتبات المحلية 100% وبدون إنترنت -->
  <script src="three.min.js"></script>
  <script src="game.js"></script>

</body>
</html>
